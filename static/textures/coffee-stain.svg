<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Faint coffee ring stain, used sparingly as a weathering prop. Self-contained. -->
  <defs>
    <filter id="edge"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="10"/></filter>
  </defs>
  <g filter="url(#edge)" fill="none" stroke="#5a3d24" opacity="0.14">
    <circle cx="130" cy="130" r="86" stroke-width="7"/>
    <circle cx="130" cy="130" r="78" stroke-width="2" opacity="0.6"/>
  </g>
  <circle cx="130" cy="130" r="82" fill="#5a3d24" opacity="0.03"/>
</svg>
