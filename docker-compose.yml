services:
  exhibit:
    build: .
    image: nescience:latest
    container_name: nescience
    ports:
      - "5001:5001"
    environment:
      # Signs the investigator session cookie. Required when a password is
      # set (both gunicorn workers must share it). Read from .env — see
      # .env.example. Compose refuses to start if it is missing.
      NESCIENCE_SECRET_KEY: ${NESCIENCE_SECRET_KEY:?set NESCIENCE_SECRET_KEY in .env}
      # The investigator surface stays disabled (404) while this is empty.
      NESCIENCE_INVESTIGATOR_PASSWORD: ${NESCIENCE_INVESTIGATOR_PASSWORD:-}
      NESCIENCE_DATA_DIR: /exhibit/data
    volumes:
      # Testimony survives a rebuild and never enters an image layer.
      - nescience-data:/exhibit/data
    restart: unless-stopped

volumes:
  nescience-data:
